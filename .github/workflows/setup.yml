name: Update profile status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile-location.json
      - scripts/render_profile.py
      - .github/workflows/setup.yml

permissions:
  contents: write

concurrency:
  group: profile-weather
  cancel-in-progress: false

jobs:
  console:
    runs-on: ubuntu-latest
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render current location and weather
        run: python3 scripts/render_profile.py
      - name: Commit profile update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            if git diff --quiet -- README.md; then exit 0; fi
            git add README.md
            git commit -m "Refresh profile weather"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/render_profile.py
          done
          echo "Profile changed repeatedly; a later run will retry."
          exit 1
